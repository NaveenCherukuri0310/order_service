openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: >
    Order Management API built with Go, Gin, and MongoDB.
    Uses JWT Bearer auth for protected order routes.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Health and utility endpoints
  - name: Auth
    description: Development token endpoint for local testing
  - name: Orders
    description: Order management endpoints

paths:
  /ping:
    get:
      tags:
        - Health
      summary: Health check
      operationId: ping
      responses:
        "200":
          description: Pong response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
              example:
                message: pong

  /test-token:
    get:
      tags:
        - Auth
      summary: Generate a development JWT token
      description: >
        Development only endpoint that returns a JWT token for testing protected routes.
      operationId: getTestToken
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /orders:
    post:
      tags:
        - Orders
      summary: Create an order
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
            example:
              status: new
              items:
                - product_name: iPhone 15
                  quantity: 3
                  unit_price: 999
                - product_name: MacBook Air
                  quantity: 1
                  unit_price: 1299
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Missing Authorization header
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Failed to create order

    get:
      tags:
        - Orders
      summary: Get all orders
      operationId: getOrders
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of orders (disabled orders are not included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get an order by UUID
      operationId: getOrderById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found (including disabled orders)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Order not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Orders
      summary: Update an order by UUID
      operationId: updateOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateRequest"
            example:
              status: updated
              items:
                - product_name: iPhone 15
                  quantity: 2
                  unit_price: 999
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSuccessResponse"
              example:
                message: Order updated successfully
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid body
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found (including disabled orders)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Order not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: pong

    TokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT token for Authorization header
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    UpdateSuccessResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    OrderItemInput:
      type: object
      required:
        - product_name
        - quantity
        - unit_price
      properties:
        product_name:
          type: string
          example: iPhone 15
        quantity:
          type: integer
          minimum: 1
          example: 3
        unit_price:
          type: number
          format: double
          minimum: 0
          example: 999

    OrderItem:
      allOf:
        - $ref: "#/components/schemas/OrderItemInput"
        - type: object
          required:
            - total_price
          properties:
            total_price:
              type: number
              format: double
              minimum: 0
              description: Computed by server as unit_price * quantity
              example: 2997

    OrderCreateRequest:
      type: object
      required:
        - status
        - items
      properties:
        status:
          type: string
          example: new
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderUpdateRequest:
      type: object
      required:
        - status
        - items
      properties:
        status:
          type: string
          example: updated
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderResponse:
      type: object
      required:
        - order_id
        - status
        - items
        - created_at
        - updated_at
      properties:
        order_id:
          type: string
          format: uuid
          example: 7f2a2c5f-3a7a-4de4-a838-22e47fbc45e9
        status:
          type: string
          example: new
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
          example: 2025-12-10T22:01:55.123Z
        updated_at:
          type: string
          format: date-time
          example: 2025-12-10T22:01:55.123Z
